name: Beacon PHP Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate PHP ${{ matrix.php-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: pdo_sqlite
      - name: Checkout pinned Beacon extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: beacon-observability/beacon-php-instrumentation
          ref: b95a03b07149aeab68dfa2e143b7b3c4dda5dd63
          path: .beacon-extension
          persist-credentials: false
      - name: Build and enable Beacon extension
        shell: bash
        run: |
          cd .beacon-extension/ext
          phpize
          ./configure
          make -j2
          ini_dir="$(php --ini | awk -F': ' '/Scan for additional .ini files in:/{print $2}')"
          test -d "${ini_dir}"
          echo "extension=${PWD}/modules/opentelemetry.so" | sudo tee "${ini_dir}/99-beacon-opentelemetry.ini"
          php --ri opentelemetry
          php -r 'exit(OpenTelemetry\Instrumentation\BEACON_DISTRIBUTION === "Beacon" ? 0 : 1);'
      - name: Validate release version
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' beacon/version.properties)"
          test -n "${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          php beacon/scripts/check-project.php
      - name: Validate and install Composer package
        run: |
          composer validate --strict --no-check-version
          composer install --prefer-dist --no-progress --no-interaction
          composer check
      - name: Validate OTLP trace receiver path
        if: matrix.php-version == '8.4'
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' beacon/version.properties)"
          collector_version=0.161.0
          collector_archive="otelcol-contrib_${collector_version}_linux_amd64.tar.gz"
          collector_url="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${collector_version}"
          curl --fail --location --retry 3 --output "${collector_archive}" "${collector_url}/${collector_archive}"
          echo "778c689efa681ff6e4722ce9f66b9b7f57c3ba009ab2e2b43dc2e0315862c731  ${collector_archive}" | sha256sum --check
          mkdir .otelcol
          tar -xzf "${collector_archive}" -C .otelcol
          .otelcol/otelcol-contrib --config=beacon/tests/collector-config.yaml > .otelcol/collector.log 2>&1 &
          collector_pid=$!
          trap 'kill "${collector_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --output /dev/null http://127.0.0.1:4318/; then
              break
            fi
            kill -0 "${collector_pid}"
            if [[ "${attempt}" -eq 20 ]]; then
              echo 'Collector did not become ready in time.' >&2
              exit 1
            fi
            sleep 1
          done
          php beacon/tests/emit-otlp-span.php http://127.0.0.1:4318/v1/traces
          component_dir="$(mktemp -d)"
          composer init --working-dir="${component_dir}" --name=beacon/component-test --no-interaction
          composer config --working-dir="${component_dir}" repositories.beacon path "${GITHUB_WORKSPACE}"
          composer require --working-dir="${component_dir}" \
            "beacon-observability/beacon-php:${version}" \
            open-telemetry/opentelemetry-auto-pdo \
            --no-progress --no-interaction
          OTEL_PHP_AUTOLOAD_ENABLED=true \
          OTEL_SERVICE_NAME=beacon-pdo-release-validation \
          OTEL_TRACES_EXPORTER=otlp \
          OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf \
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://127.0.0.1:4318/v1/traces \
            php "${GITHUB_WORKSPACE}/beacon/tests/emit-pdo-query.php" "${component_dir}/vendor/autoload.php"
          kill "${collector_pid}"
          wait "${collector_pid}" || true
          trap - EXIT
          grep -F 'beacon.release.validation' .otelcol/collector.log
          grep -F 'beacon_integration_probe' .otelcol/collector.log
      - name: Build release archive and checksum
        if: matrix.php-version == '8.4'
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' beacon/version.properties)"
          composer archive --format=zip --dir=dist
          zip -j "dist/beacon-php-${version}.zip" LICENSE
          cp LICENSE dist/LICENSE
          archive_path="dist/beacon-php-${version}.zip"
          if unzip -Z1 "${archive_path}" | grep -Eq '(^|/)(\.beacon-extension|\.otelcol|beacon|tests|vendor)(/|$)|(^|/)otelcol-contrib_'; then
            echo 'Release archive contains development or CI-only content.' >&2
            exit 1
          fi
          archive_size="$(stat -c '%s' "${archive_path}")"
          if [[ "${archive_size}" -ge 1048576 ]]; then
            echo "Release archive is unexpectedly large: ${archive_size} bytes." >&2
            exit 1
          fi
          cd dist
          sha256sum "beacon-php-${version}.zip" LICENSE > SHA256SUMS
      - name: Install and test release archive
        if: matrix.php-version == '8.4'
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' beacon/version.properties)"
          consumer_dir="$(mktemp -d)"
          cd "${consumer_dir}"
          composer init --name=beacon/release-install-test --no-interaction
          composer config repositories.beacon artifact "${GITHUB_WORKSPACE}/dist"
          composer require "beacon-observability/beacon-php:${version}" --no-progress --no-interaction
          vendor/bin/beacon-php --version | grep -Fx "Beacon PHP ${version}"
          vendor/bin/beacon-php doctor
      - name: Upload release candidate
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-php-release
          path: |
            dist/beacon-php-*.zip
            dist/LICENSE
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beacon-php-release
          path: dist
      - name: Verify release assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version=//p' beacon/version.properties)"
          gh release create "v${version}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Beacon PHP ${version}" \
            --notes-file "beacon/releases/${version}.md" \
            --verify-tag
